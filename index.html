<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarterly Wall Hanging Calendar</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for Aesthetic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

    <div class="wall-hanging-container">
        <!-- Brass Hanging Clip / Top Accent -->
        <div class="hanging-clip"></div>
        <div class="hanging-string"></div>

        <!-- Calendar Header -->
        <header class="calendar-header">
            <span class="brand-subtitle">AESTHETIC LIVING</span>
            <h1 id="calendar-year">2026</h1>
            <div class="divider-line"></div>
        </header>

        <!-- 4 Quarters Grid -->
        <main class="quarters-grid" id="quarters-container">
            <!-- Dynamically injected via JavaScript -->
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
